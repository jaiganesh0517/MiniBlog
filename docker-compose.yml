services:
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dockertest123
      MYSQL_DATABASE: miniblogdb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdockertest123"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/miniblogdb
      DB_USERNAME: root
      DB_PASSWORD: dockertest123
    depends_on:
      mysql-db:
        condition: service_healthy